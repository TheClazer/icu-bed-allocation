name: icu-bed-allocation

# Topology
#   browser --> app (app-1, :8000) --+--> mysql          primary, InnoDB, binlog + GTID   (:3307)
#           --> app2 (app-2, :8001) -+      | async replication
#                                    |      v
#                                    +--> mysql_replica  read replica, super_read_only    (:3308)
#                                    +--> redis          GEO, counters, pub/sub           (:6379)

x-app: &app
  build: .
  restart: unless-stopped
  volumes:
    - ./app:/srv/app
    - ./db:/srv/db
    - ./tests:/srv/tests
    # lets the app kill/restart the MySQL and Redis containers for the failure demos
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    mysql:
      condition: service_healthy
    mysql_replica:
      condition: service_healthy
    redis:
      condition: service_healthy

x-app-env: &app-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: rootpass
  MYSQL_DATABASE: icu_beds
  REPLICA_HOST: mysql_replica
  REPLICA_PORT: "3306"
  REDIS_HOST: redis
  MYSQL_CONTAINER: icu_mysql
  REPLICA_CONTAINER: icu_mysql_replica
  REDIS_CONTAINER: icu_redis
  PUBLIC_INSTANCES: app-1=http://localhost:8000,app-2=http://localhost:8001
  INTERNAL_INSTANCES: app-1=http://app:8000,app-2=http://app2:8000

services:
  mysql:
    image: mysql:8.0
    container_name: icu_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: icu_beds
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: Asia/Kolkata
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --event-scheduler=ON
      - --default-time-zone=+05:30
      - --log-bin-trust-function-creators=1
      - --innodb-lock-wait-timeout=15
      - --innodb-print-all-deadlocks=ON
      - --log-error-verbosity=3
    ports:
      - "3307:3306"            # MySQL Workbench: localhost:3307, root / rootpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./db/events.sql:/docker-entrypoint-initdb.d/03_events.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro
      - ./db/readonly_user.sql:/docker-entrypoint-initdb.d/05_readonly_user.sql:ro
      - ./db/replication_user.sql:/docker-entrypoint-initdb.d/06_replication_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -prootpass -h127.0.0.1 -e 'SELECT 1 FROM icu_beds.sim_clock' > /dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 80

  mysql_replica:
    image: mysql:8.0
    container_name: icu_mysql_replica
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: Asia/Kolkata
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --relay-log=relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-time-zone=+05:30
      - --log-bin-trust-function-creators=1
    ports:
      - "3308:3306"
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./db/replica_init.sql:/docker-entrypoint-initdb.d/01_replica_init.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -prootpass -h127.0.0.1 -e 'SELECT 1 FROM icu_beds.sim_clock' > /dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 80

  redis:
    image: redis:7-alpine
    container_name: icu_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  app:
    <<: *app
    container_name: icu_app
    environment:
      <<: *app-env
      INSTANCE_NAME: app-1
    ports:
      - "8000:8000"

  app2:
    <<: *app
    container_name: icu_app_2
    environment:
      <<: *app-env
      INSTANCE_NAME: app-2
    ports:
      - "8001:8000"

volumes:
  mysql_data:
  mysql_replica_data:
